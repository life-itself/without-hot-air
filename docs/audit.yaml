# Phase 1 audit ledger -- docs/plans/2026-08-08-revising-the-book.md
#
# One entry per claim that may have dated since the book's 2008 publication.
# Generated by 7 parallel research agents sweeping all 54 chapters; the 3
# priority-topic agents (solar, wind, cars/EVs, nuclear, fossil fuels, energy
# plans) did primary-source research per claim, the other 4 did a lighter
# sweep of the remaining chapters without sourcing (source: omitted there).
#
# Ordered by the plan's priority tiers: solar, wind, cars/EVs, nuclear,
# fossil fuels, energy plans, then the rest of the book in chapter order.
#
# This is a research artifact, NOT an edit queue. Per the plan: "Review the
# ledger with a human before a single word of the book changes." No claim
# listed here has been changed in the text.
#
# Schema: chapter, claim (verbatim quote), why_dated, confidence (high/
# medium/low -- how sure we are the claim is genuinely stale), priority
# (high/medium/low -- how much it matters to the book's core arithmetic/
# argument), source (optional: name, url, figure), note (optional).

- chapter: chap06
  claim: Typical solar panels have an efficiency of about 10%; expensive ones perform at 20%.
  why_dated: Mass-market panel efficiency has risen substantially since 2008; 20% is now the mid-range/typical
    figure, not the premium figure.
  confidence: high
  priority: high
  source:
    name: Clean Energy Reviews / industry efficiency guides, 2025
    url: https://www.cleanenergyreviews.info/blog/most-efficient-solar-panels
    figure: Standard commercial panels now run ~20-22% efficient, with top-tier N-type monocrystalline
      panels reaching 22-24.8%.
- chapter: chap06
  claim: the present cost of installing such photovoltaic panels is about four times the cost of installing
    solar thermal panels
  why_dated: PV module costs have fallen roughly 90%+ since 2008 (the 'Swanson's Law' cost-decline curve),
    overturning the stated cost ratio between PV and solar thermal.
  confidence: high
  priority: medium
- chapter: chap06
  claim: today, electricity from solar farms would be four times as expensive as the market rate
  why_dated: Utility-scale solar LCOE has collapsed and is now at or below the cost of new fossil generation
    in most markets — the opposite relationship to what MacKay describes.
  confidence: high
  priority: high
  source:
    name: Lazard Levelized Cost of Energy+, June 2024
    url: https://www.lazard.com/media/xemfey0k/lazards-lcoeplus-june-2024-_vf.pdf
    figure: Unsubsidized utility-scale solar PV LCOE ~= $61/MWh in 2024, versus $76/MWh for new combined-cycle
      gas -- solar is now cheaper than new fossil generation, not 4x market rate.
- chapter: chap06
  claim: the wholesale cost of the electricity would be EUR0.25 per kWh (for a Bavaria-style solar farm)
  why_dated: EUR0.25/kWh (EUR250/MWh) is roughly 5-8x current utility solar costs.
  confidence: high
  priority: medium
  source:
    name: Lazard LCOE+, June 2024
    url: https://www.lazard.com/media/xemfey0k/lazards-lcoeplus-june-2024-_vf.pdf
    figure: Utility-scale solar PV LCOE ~= $61/MWh (~= EUR0.055/kWh) in 2024.
